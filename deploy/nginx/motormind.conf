# Copie para /etc/nginx/sites-available/motormind.conf
# Ajuste server_name antes de habilitar.

server {
    listen 80;
    server_name SEU_DOMINIO www.SEU_DOMINIO;

    client_max_body_size 25M;

    location /static/ {
        alias /var/www/motormind/current/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /var/www/motormind/current/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
