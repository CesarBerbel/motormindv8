<div class="grid gap-4 md:grid-cols-2">
  <div class="form-control md:col-span-2">
    <label class="label"><span class="label-text font-medium">{{ form.titulo.label }}</span></label>
    {{ form.titulo }}
    {% for error in form.titulo.errors %}<span class="label-text-alt text-error">{{ error }}</span>{% endfor %}
  </div>
  <div class="form-control">
    <label class="label"><span class="label-text font-medium">{{ form.cabecalho.label }}</span></label>
    {{ form.cabecalho }}
    {% for error in form.cabecalho.errors %}<span class="label-text-alt text-error">{{ error }}</span>{% endfor %}
  </div>
  <div class="form-control">
    <label class="label"><span class="label-text font-medium">{{ form.notas_rodape.label }}</span></label>
    {{ form.notas_rodape }}
    {% for error in form.notas_rodape.errors %}<span class="label-text-alt text-error">{{ error }}</span>{% endfor %}
  </div>
</div>
<div class="grid gap-3 md:grid-cols-2">
  <label class="label cursor-pointer justify-start gap-3 rounded-box border border-base-300 p-3">
    {{ form.mostrar_assinatura_cliente }}
    <span class="label-text">{{ form.mostrar_assinatura_cliente.label }}</span>
  </label>
  <label class="label cursor-pointer justify-start gap-3 rounded-box border border-base-300 p-3">
    {{ form.mostrar_assinatura_oficina }}
    <span class="label-text">{{ form.mostrar_assinatura_oficina.label }}</span>
  </label>
</div>
