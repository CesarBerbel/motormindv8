{% extends 'base.html' %}

{% block title %}{{ title }} | MotorMind{% endblock %}

{% block content %}
<div class="mx-auto max-w-xl">
  <div class="card bg-base-100 shadow-xl">
    <div class="card-body">
      <h1 class="card-title text-2xl">{{ title }}</h1>
      <p>Tem certeza de que deseja excluir <strong>{{ object }}</strong>?</p>
      <p class="text-sm text-base-content/70">O serviço será marcado como excluído e deixará de aparecer nas telas principais.</p>

      <form method="post" class="card-actions justify-end mt-4">
        {% csrf_token %}
        <a href="{{ cancel_url }}" class="btn btn-ghost whitespace-nowrap">Cancelar</a>
        <button type="submit" class="btn btn-error whitespace-nowrap">Excluir</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
