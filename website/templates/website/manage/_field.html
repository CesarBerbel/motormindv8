{% comment %}Renderiza um campo de formulário com rótulo, ajuda e erros. Espera `field`.{% endcomment %}
<div class="form-control">
  <label class="label" for="{{ field.id_for_label }}">
    <span class="label-text">{{ field.label }}{% if field.field.required %} <span class="text-error">*</span>{% endif %}</span>
  </label>
  {{ field }}
  {% if field.help_text %}<span class="label-text-alt text-base-content/60">{{ field.help_text }}</span>{% endif %}
  {% for error in field.errors %}<span class="label-text-alt text-error">{{ error }}</span>{% endfor %}
</div>
