{% extends 'base.html' %}

{% block title %}Alterar senha | MotorMind{% endblock %}

{% block content %}
<div class="mx-auto max-w-xl">
  <div class="card bg-base-100 shadow-xl">
    <div class="card-body">
      <h1 class="card-title text-2xl">Alterar senha</h1>
      <p class="text-sm text-base-content/70">Informe a senha atual e escolha uma nova senha forte.</p>
      <form method="post" class="mt-4 grid gap-4">
        {% csrf_token %}
        {% include 'includes/form_fields.html' %}
        <div class="flex justify-end gap-2">
          <a href="{% url 'dashboard' %}" class="btn btn-ghost">Cancelar</a>
          <button type="submit" class="btn btn-primary">Salvar nova senha</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
